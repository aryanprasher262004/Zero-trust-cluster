# Allow pods within team-a to talk to each other
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal
  namespace: team-a
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}       # Only from pods in same namespace
  egress:
    - to:
        - podSelector: {}       # Only to pods in same namespace
