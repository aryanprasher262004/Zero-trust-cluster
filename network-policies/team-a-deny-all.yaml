# Block ALL incoming and outgoing traffic in team-a by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: team-a
spec:
  podSelector: {}        # Applies to ALL pods in team-a
  policyTypes:
    - Ingress
    - Egress
  # No ingress or egress rules = deny everything
