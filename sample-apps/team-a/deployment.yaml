apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-a-app
  namespace: team-a
  labels:
    app: team-a-app
    team: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-a-app
  template:
    metadata:
      labels:
        app: team-a-app
        team: team-a
    spec:
      serviceAccountName: team-a-service-account
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: team-a-service
  namespace: team-a
  labels:
    app: team-a-app
    team: team-a
spec:
  selector:
    app: team-a-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
