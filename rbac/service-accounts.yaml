# Service Account for Team A
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-a-service-account
  namespace: team-a
  labels:
    team: team-a
---
# Service Account for Team B
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-b-service-account
  namespace: team-b
  labels:
    team: team-b
---
# Service Account for Team A developer (human user)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-a-developer
  namespace: team-a
  labels:
    team: team-a
    role: developer
---
# Service Account for Team B developer (human user)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-b-developer
  namespace: team-b
  labels:
    team: team-b
    role: developer
